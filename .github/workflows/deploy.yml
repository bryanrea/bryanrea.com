name: Deploy to Digital Ocean

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/bryanrea.com
            git pull origin main
            # Sync Python deps into the service's virtualenv. Fast no-op when
            # requirements.txt is unchanged, so it's safe to run every deploy.
            fragments/venv/bin/pip install --upgrade -r fragments/requirements.txt
            systemctl restart fragments-blog
            systemctl is-active fragments-blog
