{% extends "base.html" %}
{% from "_macros.html" import post_preview %}

{% block title %}Fragments - Home{% endblock %}

{% block content %}
<div class="posts-list">
    {% if posts %}
        {% for post in posts %}
        {{ post_preview(post) }}
        {% endfor %}
    {% else %}
        <div class="no-posts">
            <p>No posts yet. Check back soon!</p>
        </div>
    {% endif %}
</div>
{% endblock %}
