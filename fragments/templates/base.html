<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Building with AI, in public. A blog by Bryan Rea.{% endblock %}">
    <title>{% block title %}Fragments{% endblock %}</title>

    <link rel="canonical" href="{% block canonical_url %}{{ absolute_url('fragments.index') }}{% endblock %}">

    <!-- Social sharing — how a link to this page renders when it's posted to
         LinkedIn, Slack, X, Bluesky, and the like. Title and description are
         pulled from the blocks above via self.*, so each page still sets them
         in exactly one place. No og:image yet; until a share card exists,
         twitter:card stays "summary" (the text-only form).

         striptags is what makes replaying a block safe here: a block's literal
         text isn't escaped on the way out, so the quotes in a title like
         Posts tagged "ai" would close the content attribute early. striptags
         hands back a plain string, which autoescaping then quotes properly. -->
    <meta property="og:site_name" content="Fragments">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{{ self.title()|striptags }}">
    <meta property="og:description" content="{{ self.meta_description()|striptags }}">
    <meta property="og:url" content="{{ self.canonical_url() }}">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ self.title()|striptags }}">
    <meta name="twitter:description" content="{{ self.meta_description()|striptags }}">

    {% block extra_meta %}{% endblock %}

    <!-- Web fonts: Fraunces (variable serif, headlines) + DM Sans (sans, body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400..600&display=swap">

    <link rel="stylesheet" href="/shared/css/shared.css?v={{ cache_bust }}">
    <link rel="stylesheet" href="{{ url_for('fragments.static', filename='css/style.css') }}?v={{ cache_bust }}">

    <!-- RSS feed auto-discovery -->
    <link rel="alternate" type="application/rss+xml" title="Fragments RSS Feed" href="{{ url_for('fragments.feed') }}">

    <!-- Fathom Analytics -->
    <script
      src="https://cdn.usefathom.com/script.js"
      data-site="VBYEXRMM"
      defer
    ></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <div class="background" aria-hidden="true">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="noise"></div>
    </div>

    <nav class="nav" aria-label="Site">
        <div class="nav-inner">
            <div class="nav-group nav-start">
                <a href="https://bryanrea.com">Home</a>
                <a href="https://bryanrea.com/about">About</a>
            </div>

            <a href="https://bryanrea.com" class="nav-title display display--sm">Bryan Rea</a>

            <div class="nav-group nav-end">
                <a href="https://bryanrea.com/experience">Experience</a>
                <a href="{{ url_for('fragments.index') }}">Fragments</a>
            </div>
        </div>
    </nav>

    {% block site_header %}
    <header class="hero">
        <div class="hero-name">
            <h1 class="display display--hero"><a href="{{ url_for('fragments.index') }}">Fragments</a></h1>
            <p class="tagline">Building with AI, in public</p>
        </div>
    </header>
    {% endblock %}

    <main class="container" id="main">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>Built with AI • <a href="https://github.com/bryanrea/bryanrea.com" target="_blank" rel="noopener">View Source</a> • <a href="{{ url_for('fragments.feed') }}">RSS</a></p>
        </div>
    </footer>

    <script src="/shared/js/main.js?v={{ cache_bust }}" defer></script>
</body>
</html>
