<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Fragments - A lightweight, AI-built blog{% endblock %}">
    <title>{% block title %}Fragments{% endblock %}</title>

    <!-- Web fonts: Fraunces (variable serif, headlines) + Inter (sans, body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap">

    <link rel="stylesheet" href="/shared/css/shared.css?v={{ cache_bust }}">
    <link rel="stylesheet" href="{{ url_for('fragments.static', filename='css/style.css') }}?v={{ cache_bust }}">

    <!-- RSS feed auto-discovery -->
    <link rel="alternate" type="application/rss+xml" title="Fragments RSS Feed" href="{{ url_for('fragments.feed') }}">

    <!-- Fathom Analytics -->
    <script
      src="https://cdn.usefathom.com/script.js"
      data-site="VBYEXRMM"
      defer
    ></script>
</head>
<body>
    <div class="background">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="noise"></div>
    </div>

    <nav class="nav">
        <div class="nav-inner">
            <div class="nav-group nav-start">
                <a href="https://bryanrea.com">Home</a>
                <a href="https://bryanrea.com/about">About</a>
            </div>

            <a href="https://bryanrea.com" class="nav-title">Bryan Rea</a>

            <div class="nav-group nav-end">
                <a href="https://bryanrea.com/experience">Experience</a>
                <a href="{{ url_for('fragments.index') }}">Fragments</a>
            </div>
        </div>
    </nav>

    {% block site_header %}
    <header class="hero">
        <div class="container">
            <div class="site-identity">
                <h1><a href="{{ url_for('fragments.index') }}">Fragments</a></h1>
                <p class="tagline">Building with AI, in public</p>
            </div>
        </div>
    </header>
    {% endblock %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>Built with AI • <a href="https://github.com/bryanrea/bryanrea.com" target="_blank">View Source</a> • <a href="{{ url_for('fragments.feed') }}">RSS</a></p>
        </div>
    </footer>

    <script src="/shared/js/main.js?v={{ cache_bust }}" defer></script>
</body>
</html>
